<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Poesía</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f9;
      color: #333;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #estado-diccionario {
      margin-top: 10px;
      font-weight: bold;
    }
    #notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #28a745;
      color: white;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Proyecto Poesía</h1>

  <!-- Panel de Gestión de Diccionarios -->
  <div class="panel">
    <h2>Gestor de Diccionarios</h2>
    <p>Para buscar rimas y métrica offline, descarga el diccionario en español:</p>
    <button id="btn-descargar">Descargar / Actualizar Diccionario Español</button>
    <div id="estado-diccionario">Comprobando estado del diccionario...</div>
  </div>

  <!-- Notificación de actualización del programa -->
  <div id="notification">
    <span>Nueva versión del programa disponible. Descargando...</span>
  </div>

  <script>
    const fs = require('fs');
    const path = require('path');
    const https = require('https');
    const { ipcRenderer } = require('electron');

    const rutaDiccionario = path.join(__dirname, 'diccionario.json');
    const URL_DICCIONARIO = 'https://raw.githubusercontent.com/danisuarezinef-ai/proyecto-poesia/main/diccionario.json';

    const btnDescargar = document.getElementById('btn-descargar');
    const estado = document.getElementById('estado-diccionario');

    function verificarDiccionario() {
      if (fs.existsSync(rutaDiccionario)) {
        estado.textContent = "Status: Diccionario de Español instalado y listo para usar.";
        estado.style.color = "green";
      } else {
        estado.textContent = "Status: No hay diccionario instalado. Haz clic en 'Descargar'.";
        estado.style.color = "orange";
      }
    }

    // Función de descarga usando módulo nativo HTTPS
    function descargarArchivo(url, rutaDestino) {
      return new Promise((resolve, reject) => {
        const solicitar = (urlActual) => {
          https.get(urlActual, { headers: { 'User-Agent': 'Electron-App' } }, (respuesta) => {
            // Manejar redirecciones de GitHub
            if (respuesta.statusCode >= 300 && respuesta.statusCode < 400 && respuesta.headers.location) {
              solicitar(respuesta.headers.location);
              return;
            }

            if (respuesta.statusCode !== 200) {
              reject(new Error(`Error HTTP ${respuesta.statusCode}`));
              return;
            }

            const stream = fs.createWriteStream(rutaDestino);
            respuesta.pipe(stream);

            stream.on('finish', () => {
              stream.close(resolve);
            });
          }).on('error', (err) => {
            fs.unlink(rutaDestino, () => {});
            reject(err);
          });
        };

        solicitar(url);
      });
    }

    btnDescargar.addEventListener('click', async () => {
      estado.textContent = "Descargando diccionario desde GitHub, por favor espera...";
      estado.style.color = "blue";

      try {
        await descargarArchivo(URL_DICCIONARIO, rutaDiccionario);
        estado.textContent = "¡Diccionario descargado y guardado correctamente!";
        estado.style.color = "green";
      } catch (error) {
        estado.textContent = "Error durante la descarga: " + error.message;
        estado.style.color = "red";
      }
    });

    ipcRenderer.on('update_available', () => {
      ipcRenderer.removeAllListeners('update_available');
      const notification = document.getElementById('notification');
      notification.style.display = 'block';
    });

    verificarDiccionario();
  </script>
</body>
</html>
