<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Poesía</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f9;
      color: #333;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #estado-diccionario {
      margin-top: 10px;
      font-weight: bold;
    }
    #notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #28a745;
      color: white;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Proyecto Poesía</h1>

  <!-- Panel de Gestión de Diccionarios -->
  <div class="panel">
    <h2>Gestor de Diccionarios</h2>
    <p>Para buscar rimas y métrica offline, descarga el diccionario en español:</p>
    <button id="btn-descargar">Descargar / Actualizar Diccionario Español</button>
    <div id="estado-diccionario">Comprobando estado del diccionario...</div>
  </div>

  <!-- Notificación de actualización del programa -->
  <div id="notification">
    <span>Nueva versión del programa disponible. Descargando...</span>
  </div>

  <script>
    const fs = require('fs');
    const path = require('path');
    const { ipcRenderer } = require('electron');

    // Directorio local donde se guardará el diccionario
    const rutaDiccionario = path.join(__dirname, 'diccionario.json');

    // URLs de respaldo (main y master)
    const URL_MAIN = 'https://raw.githubusercontent.com/danisuarezinef-ai/diccionario.json/main/diccionario.json';
    const URL_MASTER = 'https://raw.githubusercontent.com/danisuarezinef-ai/diccionario.json/master/diccionario.json';

    const btnDescargar = document.getElementById('btn-descargar');
    const estado = document.getElementById('estado-diccionario');

    // Verificar si ya existe el diccionario en el equipo
    function verificarDiccionario() {
      if (fs.existsSync(rutaDiccionario)) {
        estado.textContent = "Status: Diccionario de Español instalado y listo para usar.";
        estado.style.color = "green";
      } else {
        estado.textContent = "Status: No hay diccionario instalado. Haz clic en 'Descargar'.";
        estado.style.color = "orange";
      }
    }

    // Función para descargar el diccionario desde GitHub
    btnDescargar.addEventListener('click', async () => {
      estado.textContent = "Descargando diccionario desde GitHub, por favor espera...";
      estado.style.color = "blue";

      let respuesta = await fetch(URL_MAIN);
      if (!respuesta.ok) {
        // Intento de respaldo en rama master si main falla
        respuesta = await fetch(URL_MASTER);
      }

      try {
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status} - No se encontró el archivo en GitHub.`);
        
        const datos = await respuesta.text();
        fs.writeFileSync(rutaDiccionario, datos, 'utf-8');

        estado.textContent = "¡Diccionario descargado y guardado correctamente!";
        estado.style.color = "green";
      } catch (error) {
        estado.textContent = "Error durante la descarga: " + error.message;
        estado.style.color = "red";
      }
    });

    // Avisos de actualización del programa
    ipcRenderer.on('update_available', () => {
      ipcRenderer.removeAllListeners('update_available');
      const notification = document.getElementById('notification');
      notification.style.display = 'block';
    });

    // Inicializar comprobación al abrir
    verificarDiccionario();
  </script>
</body>
</html>
