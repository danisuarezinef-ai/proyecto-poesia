name: Compilar APK v1.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Localizar y Mover Archivos a la Raíz
        run: |
          echo "Verificando ubicación de archivos..."
          if [ ! -f index.html ]; then
            find . -mindepth 2 -name "index.html" -exec cp -f {} . \;
          fi
          if [ ! -f sw.js ]; then
            find . -mindepth 2 -name "sw.js" -exec cp -f {} . \;
          fi
          if [ ! -f manifest.json ]; then
            find . -mindepth 2 -name "manifest.json" -exec cp -f {} . \;
          fi
          echo "Archivos asegurados en la raíz."

      - name: Construir paquete WebApp
        run: tar -czf app-release.tar.gz index.html sw.js manifest.json

      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          files: app-release.tar.gz
          tag_name: v1.0.0
          name: Proyecto Poesía v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
